<!-- =================== PREMIUM CSS =================== -->
<style>
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
}

.screen{
  display:none;
  opacity:0;
  transition:opacity 0.35s ease;
  width:100%;
  min-height:100vh;
  padding:60px 20px;
}

.screen.active{
  display:block;
  opacity:1;
}

#admin {
  display:flex;
  flex-direction:column;
  gap:40px; /* spacing between major sections */
}

#bookingsList,
#calendar,
#monthlyStats,
.charts-grid {
  position:relative;
  width:100%;
}

body{
  background: linear-gradient(135deg,#fdf7ef,#f6efe5,#fffaf3);
  min-height:100vh;
}

body.dark{
  background:#121212;
  color:#f5f5f5;
}

body.dark .booking-card,
body.dark .style-card,
body.dark .modal-content{
  background:#1e1e1e;
  color:#fff;
}

body.dark .button{
  background:#333;
}

body.dark .dashboard-card{
  background: rgba(30,30,30,0.6);
  border:1px solid rgba(255,255,255,0.08);
}

/* --- GOLD SHIMMER --- */
.gold-shimmer{
  font-family:'Playfair Display',serif;
  font-size:3rem;
  background:linear-gradient(90deg,#b88c4a,#ffd700,#b88c4a);
  background-size:200% auto;
  color:transparent;
  -webkit-background-clip:text;
  background-clip:text;
  animation:shimmer 2.5s linear infinite;
  text-align:center;
  margin-bottom:50px;
}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}

/* --- BUTTONS --- */
.button{
  padding:12px 24px;border:none;border-radius:8px;
  background:#b88c4a;color:#fff;font-weight:500;cursor:pointer;
  transition:all 0.25s ease;box-shadow:0 4px 6px rgba(0,0,0,0.1);
  margin:5px 0;
}
.button:hover{background:#a3733f;transform:translateY(-2px);}
.button.decline{background:#e74c3c;} .button.decline:hover{background:#c0392b;}
.button.accept{background:#27ae60;} .button.accept:hover{background:#1e8449;}
.button.danger{background:#c0392b;} 
.button.clear{background:#2980b9;} .button.clear:hover{background:#1c5980;}

/* --- MODAL --- */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;   /* force exact viewport height */
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:10000;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-content input {
  box-sizing: border-box;
}

.modal-content{
  background:#fff8f0;
  padding:40px 30px;
  border-radius:15px;
  max-width:400px;
  width:90%;
  position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.modal-content.shake{animation:shake 0.4s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}

@keyframes shake{0%{transform:translateX(0);}25%{transform:translateX(-5px);}50%{transform:translateX(5px);}75%{transform:translateX(-5px);}100%{transform:translateX(0);}}
.modal-content h2{font-family:'Playfair Display',serif;color:#b88c4a;margin-bottom:20px;text-align:center;}
.close{position:absolute;top:15px;right:20px;font-size:1.5rem;color:#333;cursor:pointer;transition:all 0.2s ease;}
.close:hover{color:#b88c4a;}

.modal-content form,
.modal-content {
  display: flex;
  flex-direction: column;
}

.modal-content .button {
  width: 100%;
  margin-top: 10px;
}

/* --- INPUTS --- */
input[type="email"], input[type="password"]{
  width:100%;padding:12px 15px;margin-bottom:15px;border:2px solid #b88c4a;border-radius:8px;outline:none;font-size:1rem;
  transition:border 0.3s ease;
}
input:focus{border-color:#ffd700;}
.password-wrapper{position:relative;}
.toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.2rem;}
.forgot-password {
  cursor: pointer;
  color: #b88c4a;
  text-align: center;
  margin-top: 10px;
  text-decoration: underline;
}
.forgot-password:hover {
  color: #ffd700;
}

/* --- ERROR TEXT --- */
.error{color:#e74c3c;font-size:0.9rem;margin-top:-10px;margin-bottom:10px;text-align:center;}
.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid #b88c4a;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 0.8s linear infinite;
  margin: 40px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* --- BOOKING CARDS --- */
.booking-card{
  background:#fff;
  padding:20px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 6px 15px rgba(0,0,0,0.05);
  transform:translateX(-30px);
  opacity:0;
  animation:slideIn 0.4s ease forwards;
}

@keyframes slideIn{
  to{
    transform:translateX(0);
    opacity:1;
  }
}

.booking-card.pending{border-left:4px solid #f39c12;}
.booking-card.accepted{border-left:4px solid #27ae60;}
.booking-card.declined{border-left:4px solid #e74c3c;}
@keyframes fadeInCard{to{opacity:1;transform:translateY(0);}}
.booking-buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.status-buttons button{flex:1;}
.pitch-buttons button{margin-right:5px;}

/* --- DAILY SUMMARY --- */
.style-card{background:#fff8f0;padding:15px;margin-bottom:12px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.05);}

/* --- RESPONSIVE --- */
@media(max-width:768px){
  .modal-content{padding:30px 20px;}
  .booking-buttons{flex-direction:column;}
  .status-buttons button{width:100%;}
  .pitch-buttons button{width:48%;margin-bottom:5px;}
}

@media(max-width:600px){

  #admin h2{
    font-size:1.3rem;
    text-align:center;
  }

  canvas{
    margin-bottom:20px;
  }

  .booking-card{
    padding:15px;
    font-size:0.9rem;
  }

  .button{
    width:100%;
  }
}

.section-content {
  overflow: hidden;
  transition: max-height 0.4s ease;
  max-height: 0;
}

.section-content.expanded {
  max-height: 2000px; /* big enough to fit content */
}

body.dark .section-header {
  background: #222;
  color: #fff;
}

.glow { animation: glowPulse 1.5s infinite alternate; }

@keyframes glowPulse {
  0% { box-shadow: 0 0 5px gold; }
  100% { box-shadow: 0 0 20px gold; }
}

.section-header {
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111;
  color: #fff;  /* missing? you need color */
  padding: 10px;
  border-radius: 8px;
  margin-top: 15px;
}

.badge {
  background: gold;
  color: black;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 12px;
}

.kpi-card{
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.4);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:18px;
  padding:25px 20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  transition: all 0.3s ease;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.kpi-card:hover{
  transform:translateY(-5px);
  box-shadow:0 20px 40px rgba(0,0,0,0.12);
}

.kpi-card.highlight{
  background: rgba(255,215,0,0.25);
  border:1px solid rgba(255,215,0,0.4);
}

.kpi-card h5{
  font-family:'Playfair Display',serif;
  font-weight:600;
  color:#b88c4a;
  margin-bottom:10px;
}

.kpi-value{
  font-family:'Playfair Display',serif;
  font-size:1.7rem;
  font-weight:700;
  color:#111;
}

body.dark .kpi-card{
  background: rgba(30,30,30,0.6);
  border:1px solid rgba(255,255,255,0.08);
}

body.dark .kpi-card h5{
  color:#ffd700;
}

body.dark .kpi-value{
  color:#fff;
}

.dashboard-card{
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.55);
  border:1px solid rgba(255,255,255,0.4);
  padding:25px;
  border-radius:20px;
  box-shadow:0 15px 35px rgba(0,0,0,0.08);
  text-align:center;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
}

.dashboard-card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 45px rgba(0,0,0,0.15);
}

.dashboard-card h4{
  font-weight:500;
  margin-bottom:12px;
  color:#b88c4a;
  letter-spacing:0.5px;
}

.dashboard-card p{
  font-size:2rem;
  font-weight:600;
  font-family:'Playfair Display',serif;
}

.dashboard-card.highlight{
  background:linear-gradient(135deg,#ffd700,#b88c4a);
  color:#000;
}

.dashboard-card.highlight h4{
  color:#000;
}

#calendar,
#monthlyStats,
canvas {
  margin-top: 40px;
}

#bookingsList {
  margin-bottom: 40px;
  position: relative;
  z-index: 1;
  min-height: 200px;
}

.heat-cell {
  padding: 10px;
  text-align: center;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
  transition: 0.2s ease;
}

.charts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
  margin-top:20px;
}

.chart-card{
  backdrop-filter: blur(15px);
  background:rgba(255,255,255,0.5);
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.chart-card h4{
  margin-bottom:15px;
  font-weight:500;
  color:#b88c4a;
  text-align:center;
}

#bookingsList{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.booking-card{
  position:relative;
  z-index:0;
}

#calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 20px;
}

#monthlyStats{
  margin-top:20px;
}

.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid #fff;
  border-top: 2px solid transparent;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: inline-block;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

</style>

<body>

<!-- ==================== HOME SCREEN ==================== -->
<div id="home" class="screen active">

<!-- ==================== ADMIN LOGIN MODAL ==================== -->

<!-- ==================== ADMIN PANEL ==================== -->
<div id="admin" class="screen">
<button class="button" id="darkModeToggle">🌙 Dark Mode</button>

<input 
  type="text" 
  id="adminSearch"
  placeholder="Search name, phone or email..."
  style="width:100%;padding:10px;margin-bottom:15px;"
>

 <div id="bookingsList">

</div>

<!-- CALENDAR -->
<div id="calendar"></div>
<div id="monthlyStats" class="style-card"></div>

<!-- CHARTS -->
<div class="charts-grid">
  <div class="chart-card">
    <h4>Revenue Trend</h4>

  <div class="chart-card">

    <canvas id="yearlyChart"></canvas>

</div>
</div>

<script type="module">

  // ----------------- FIREBASE -----------------
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, orderBy, onSnapshot, doc, getDoc,  writeBatch, limit, startAfter, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged, setPersistence, inMemoryPersistence,   browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";

document.addEventListener("DOMContentLoaded", async () => {

  console.log("🔥 Script Loaded Properly");

  // ---------------- FIREBASE INIT ----------------
const firebaseConfig = {
  apiKey: "AIzaSyCcChD_9sMvxncp7hulcwhKlUyJ87BR7zs",
  authDomain: "braiding-bookings.firebaseapp.com",
  projectId: "braiding-bookings",
  storageBucket: "braiding-bookings.firebasestorage.app",
  messagingSenderId: "243406972406",
  appId: "1:243406972406:web:2ab34ed5ab3491af5553d7",
  measurementId: "G-4XLV27JNW8"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  window.auth = auth;

await setPersistence(auth, browserSessionPersistence);
  const functions = getFunctions(app, "us-central1");

let unsubscribeAdmin = null;
let unsubscribeBookings = null;
let unsubscribeAnalytics = null;
let adminRefreshInterval = null;
let dailyRevenue = 0;
let styleChartInstance = null;
let revenueChartInstance = null;
let isSubmitting = false;
let pastLastDoc = null;
let revenueChart, styleChart, yearlyChart;
let loadingPast = false;
const PAST_PAGE_SIZE = 25;

// ------------------ Show Screen ------------------
function showScreen(screenId) {
  const screens = document.querySelectorAll(".screen");

  screens.forEach(s => s.classList.remove("active"));

  const target = document.getElementById(screenId);

  if (!target) {
    console.warn("Screen not found:", screenId);
    return;
  }

  target.classList.add("active");
}

// ------------------ Show modal  ------------------
document.getElementById("adminBtn").addEventListener("click", () => {
  showAdminModal();
});

document.getElementById("adminLoginBtn")
  .addEventListener("click", adminLogin);

document.getElementById("closeModal")
  .addEventListener("click", hideAdminModal);

document.getElementById("logoutBtn").addEventListener("click", adminLogout);

// ------------------ Show modal function ------------------
function showAdminModal() {
  const modal = document.getElementById("adminLoginModal");
  modal.classList.add("show");
  document.body.style.overflow = "hidden"; // stop scrolling

  // Clicking outside closes the modal
  modal.addEventListener("click", function onOutsideClick(e) {
    if (e.target === modal) {
      hideAdminModal();
      modal.removeEventListener("click", onOutsideClick);
    }
  });
}

// ------------------ Hide modal function ------------------
function hideAdminModal() {
  const modal = document.getElementById("adminLoginModal");
  modal.classList.remove("show");
  document.body.style.overflow = ""; // restore scrolling

  // Clear fields
  document.getElementById("adminEmail").value = "";
  document.getElementById("adminPassword").value = "";
  document.getElementById("adminLoginError").textContent = "";

  // Make sure home screen is visible
  showScreen("home");
}

// ------------------ PRESS ENTER AFTER PASSWORD ------------------
document.getElementById("adminPassword").addEventListener("keypress", function (e) {
  if (e.key === "Enter") {
    adminLogin();
  }
});

document.getElementById("adminEmail").addEventListener("keypress", function (e) {
  if (e.key === "Enter") {
    adminLogin();
  }
});

// ------------------ Hide modal after successful login ------------------
function onAdminLoginSuccess() {
  hideAdminModal();  // hide modal
  showScreen("admin"); 
  openAdmin();       // open admin panel
}

async function adminLogin() {
  const email = document.getElementById("adminEmail").value;
  const password = document.getElementById("adminPassword").value;
  const errorEl = document.getElementById("adminLoginError");
  const loginBtn = document.getElementById("adminLoginBtn");
  const modalContent = document.querySelector("#adminLoginModal .modal-content");

  errorEl.textContent = "";

  // Start loading state
const spinner = loginBtn.querySelector(".spinner");
const text = loginBtn.querySelector(".btn-text");

text.style.display = "none";
spinner.style.display = "inline-block";
loginBtn.disabled = true;

  try {
    // 1️⃣ Sign in
    await signInWithEmailAndPassword(auth, email, password);

    // 2️⃣ Verify admin via backend
    const verifyFn = httpsCallable(functions, "verifyAdmin");
    await verifyFn();

    // 3️⃣ Mark this as a fresh login
    sessionStorage.setItem("adminJustLoggedIn", "true");

    hideAdminModal();
    openAdmin();

  } catch (err) {

    // Shake animation
    modalContent.classList.add("shake");
    setTimeout(() => {
      modalContent.classList.remove("shake");
    }, 400);

    console.error("LOGIN ERROR:", err);
    errorEl.textContent = "❌ Login failed: " + err.message;

    // Clear password
    document.getElementById("adminPassword").value = "";

    // Safety logout
    await signOut(auth);
  } finally {
    // ALWAYS reset button state
const spinner = loginBtn.querySelector(".spinner");
const text = loginBtn.querySelector(".btn-text");

spinner.style.display = "none";
text.style.display = "inline";
loginBtn.disabled = false;
  }
}

// Forgot Password function
async function forgotAdminPassword() {
  const email = document.getElementById("adminEmail").value.trim();
  const errorEl = document.getElementById("adminLoginError");
  errorEl.textContent = "";

  if (!email) {
    errorEl.textContent = "❌ Please enter your admin email.";
    return;
  }

  try {
    const forgotFn = httpsCallable(functions, "forgotAdminPassword");
    const result = await forgotFn({ email });

    alert(result.data.message); // e.g., "If this email is registered as an admin, a reset email has been sent."
  } catch (err) {
    console.error("Forgot password error:", err);
    errorEl.textContent = "❌ " + (err.message || "Failed to send reset email");
  }
}

// Keep only one onAuthStateChanged listener
onAuthStateChanged(auth, async (user) => {
  const lastBooking = sessionStorage.getItem("lastBookingReference");

  // 🔐 If admin is logged in → ALWAYS go to admin only
  if (user) {
    try {
      const verifyFn = httpsCallable(functions, "verifyAdmin");
      await verifyFn();

      openAdmin();
      return; // STOP here. Never load confirmation.
    } catch (err) {
      await signOut(auth);
      showScreen("home");
      return;
    }
  }

 // 👤 Normal user
showScreen("home");

// Clean URL if someone manually pasted confirmation link
const params = new URLSearchParams(window.location.search);
if (params.has("bookingId") || params.has("reference")) {
  window.history.replaceState({}, document.title, window.location.pathname);
}
});     

 function toggleAdminPassword() {
  const passwordInput = document.getElementById("adminPassword");
  const icon = document.querySelector(".toggle-password");

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    icon.textContent = "🙈";
  } else {
    passwordInput.type = "password";
    icon.textContent = "👁️";
  }
}

async function adminLogout() {
  sessionStorage.removeItem("lastBookingReference");

  await signOut(auth);

  showScreen("home");
}

const darkModeBtn = document.getElementById("darkModeToggle");

darkModeBtn.addEventListener("click", () => {
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");
  localStorage.setItem("darkMode", isDark ? "enabled" : "disabled");

  darkModeBtn.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
});

if (localStorage.getItem("darkMode") === "enabled") {
  document.body.classList.add("dark");
  darkModeBtn.textContent = "☀️ Light Mode";
}

function estimateToHours(estimate) {
  if (!estimate) return 0;

  // Extract numbers like "4 hrs", "3.5 hours", etc.
  const match = estimate.match(/[\d.]+/);
  return match ? parseFloat(match[0]) : 0;
}

// ----------------- SEARCH BAR ----------------
let searchTimeout = null;

document.getElementById("adminSearch")
  .addEventListener("input", (e) => {

  clearTimeout(searchTimeout);

  searchTimeout = setTimeout(() => {
    performSearch(e.target.value.trim());
  }, 400);
});

async function performSearch(term) {

  if (!term) {
    openAdmin();
    return;
  }

  const bookingsRef = collection(db, "bookings");

  const snapshot = await getDocs(
    query(
      bookingsRef,
      where("clientName", ">=", term),
      where("clientName", "<=", term + "\uf8ff"),
      limit(25)
    )
  );

  const list = document.getElementById("bookingsList");
  list.innerHTML = "";

  snapshot.forEach(docSnap => {
    const booking = docSnap.data();
    const id = docSnap.id;
    list.appendChild(createCard(booking, id, "today"));
  });
}

// ----------------- (LOADS TODAY + UPCOMING + ANALYSTICS) ----------------
function startAdminListener() {

  if (unsubscribeAdmin) unsubscribeAdmin();

  const bookingsRef = collection(db, "bookings");

  unsubscribeAdmin = onSnapshot(
    query(bookingsRef, orderBy("date", "asc")),
    (snapshot) => {

      const todaySection = document.getElementById("todaySection");
      const upcomingSection = document.getElementById("upcomingSection");
      const pastSection = document.getElementById("pastSection");

      todaySection.innerHTML = "";
      upcomingSection.innerHTML = "";
      pastSection.innerHTML = "";

      let todayCount = 0;
      let upcomingCount = 0;
      let pastCount = 0;

      let daily = 0;
      let monthly = 0;
      let yearly = 0;

      let styleTotals = {};
      let monthlyTotals = {};
      let yearlyTotals = {};

      const now = new Date();
      const todayStr = now.toISOString().split("T")[0];
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      snapshot.forEach(docSnap => {

  const b = docSnap.data();
  const id = docSnap.id;

  const bookingDateTime =
new Date(`${b.date}T${b.time || "00:00"}`);

  // SECTION LOGIC
  if (b.date === todayStr) {
    todaySection.appendChild(createCard(b, id, "today"));
    todayCount++;
  }
  else if (bookingDateTime > now) {
    upcomingSection.appendChild(createCard(b, id, "upcoming"));
    upcomingCount++;
  }
  else {
    pastSection.appendChild(createCard(b, id, "past"));
    pastCount++;
  }

 // REVENUE LOGIC
if (b.pitched === true && b.pitchedConfirmedAt) {

  const price = Number(b.price) || 0;

  const bookingDate = new Date(b.date);
  const confirmedDate = b.pitchedConfirmedAt.toDate();

  // TODAY revenue = only if booking is today
  if (b.date === todayStr) {
    daily += price;
  }

  // MONTH revenue = based on when pitched was confirmed
  if (
    confirmedDate.getMonth() === currentMonth &&
    confirmedDate.getFullYear() === currentYear
  ) {
    monthly += price;
  }

  // YEAR revenue
  if (confirmedDate.getFullYear() === currentYear) {
    yearly += price;
  }

  // STYLE TOTALS
  styleTotals[b.style] =
    (styleTotals[b.style] || 0) + price;

  const monthKey =
    `${confirmedDate.getFullYear()}-${confirmedDate.getMonth()+1}`;

  monthlyTotals[monthKey] =
    (monthlyTotals[monthKey] || 0) + price;

  const yearKey = confirmedDate.getFullYear();

  yearlyTotals[yearKey] =
    (yearlyTotals[yearKey] || 0) + price;
}

}); // ← LOOP ENDS HERE


// ✅ UPDATE UI AFTER LOOP
document.getElementById("todayCount").textContent = todayCount;
document.getElementById("upcomingCount").textContent = upcomingCount;
document.getElementById("pastCount").textContent = pastCount;

document.getElementById("todayRevenue").textContent =
  "R " + daily.toFixed(2);

document.getElementById("monthRevenue").textContent =
  "R " + monthly.toFixed(2);

document.getElementById("yearRevenue").textContent =
  "R " + yearly.toFixed(2);

buildCharts(styleTotals, monthlyTotals, yearlyTotals);

    });
}

function toggleSection(header) {
  const content = header.nextElementSibling;

  content.classList.toggle("expanded");
}

async function loadPastBookings(reset = false) {

  if (loadingPast) return;
  loadingPast = true;

  const pastSection = document.getElementById("pastSection");
  const bookingsRef = collection(db, "bookings");

  const now = new Date();

  if (reset) {
    pastSection.innerHTML = "";
    pastLastDoc = null;
    document.getElementById("pastCount").textContent = "0";
  }

  let q;

  if (pastLastDoc && !reset) {
    q = query(
      bookingsRef,
      orderBy("date", "desc"),
      startAfter(pastLastDoc),
      limit(PAST_PAGE_SIZE)
    );
  } else {
    q = query(
      bookingsRef,
      orderBy("date", "desc"),
      limit(PAST_PAGE_SIZE)
    );
  }

  const snapshot = await getDocs(q);

  if (!snapshot.empty) {

    pastLastDoc = snapshot.docs[snapshot.docs.length - 1];

    let addedCount = 0;

    snapshot.forEach(docSnap => {

      const booking = docSnap.data();
      const id = docSnap.id;

      const bookingDateTime =
new Date(`${booking.date}T${booking.time || "00:00"}`);

      if (bookingDateTime < now) {

        pastSection.appendChild(
          createCard(booking, id, "past")
        );

        addedCount++;
      }
    });

    const badge = document.getElementById("pastCount");
    badge.textContent =
      parseInt(badge.textContent || "0") + addedCount;
  }

  loadingPast = false;
} 

function createCard(booking, id, sectionType) {

  const card = document.createElement("div");
  card.className = "booking-card";

  let pitchedButtons = "";

  if (
    (sectionType === "today" || sectionType === "past") &&
    booking.pitched === undefined
  ) {

    pitchedButtons = `
      <div class="booking-buttons">
        <button class="button accept"
          onclick="confirmPitched('${id}', true, this)">
          <span class="btn-text">✅ Pitched</span>
          <span class="spinner" style="display:none;"></span>
        </button>

        <button class="button decline"
          onclick="confirmPitched('${id}', false, this)">
          <span class="btn-text">❌ Not Pitched</span>
          <span class="spinner" style="display:none;"></span>
        </button>
      </div>
    `;
  }

  card.innerHTML = `
    <p><strong>${booking.clientName || "Unknown Client"}</strong></p>
    <p>${booking.style || ""} – ${booking.length || ""}</p>
<p>📞 ${booking.clientPhone || "No phone"}</p>
<p>✉️ ${booking.clientEmail || "No email"}</p>
    <p>${booking.date} @ ${booking.time || "00:00"}</p>
    <p>Status: ${booking.status || "Pending"}</p>
    ${pitchedButtons}
  `;

  return card;
}

//---- DASHBOARD ANALYTICS + CHARTS -----
function buildCharts(styleTotals, monthlyTotals, yearlyTotals) {

  // Destroy safely
  ["revenueChart", "styleChart", "yearChart"].forEach(chartName => {
    if (window[chartName] && typeof window[chartName].destroy === "function") {
      window[chartName].destroy();
    }
  });

  const revenueCtx = document.getElementById("revenueChart").getContext("2d");

  window.revenueChart = new Chart(revenueCtx, {
    type: "bar",
    data: {
      labels: Object.keys(monthlyTotals),
      datasets: [{
        label: "Revenue",
        data: Object.values(monthlyTotals),
        backgroundColor: "#c59d5f"
      }]
    }
  });

}

//------ REAL BOOKING HEATMAP ------
function buildHeatmap(snapshot) {

  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const counts = {};
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();

  snapshot.forEach(doc => {
    const b = doc.data();
 if (!b.date || b.pitched !== true) return;

    const d = new Date(b.date);

    if (d.getMonth() === month &&
        d.getFullYear() === year) {

      const day = d.getDate();
      counts[day] = (counts[day] || 0) + 1;
    }
  });

  const daysInMonth =
    new Date(year, month + 1, 0).getDate();

  for (let day = 1; day <= daysInMonth; day++) {

    const cell = document.createElement("div");
    cell.className = "heat-cell";

    const count = counts[day] || 0;

    cell.textContent = day;

    // intensity color
    const intensity = Math.min(count * 40, 200);
    cell.style.backgroundColor =
      `rgb(${255-intensity}, ${255-intensity}, 255)`;

    calendar.appendChild(cell);
  }
}

async function confirmPitched(id, value, btn) {

  const spinner = btn?.querySelector(".spinner");
  const text = btn?.querySelector(".btn-text");

  if (spinner && text) {
    spinner.style.display = "inline-block";
    text.style.display = "none";
    btn.disabled = true;
  }

  try {

    await updateDoc(doc(db, "bookings", id), {
      pitched: value,
      pitchedConfirmedAt: value ? new Date() : null,
      paymentStatus: value ? "Fully Paid" : "Pending"
    });

  } catch (err) {
    alert("❌ Failed: " + err.message);
  } finally {
    if (spinner && text) {
      spinner.style.display = "none";
      text.style.display = "inline";
      btn.disabled = false;
    }
  }
}

window.toggleSection = function(header) {

  const content = header.nextElementSibling;

  if (content.classList.contains("expanded")) {

    content.style.maxHeight = content.scrollHeight + "px";

    requestAnimationFrame(() => {
      content.style.maxHeight = "0px";
    });

    content.classList.remove("expanded");

  } else {

    content.classList.add("expanded");
    content.style.maxHeight = content.scrollHeight + "px";

  }
};

function clearBookingsForDate(date) {
  if (!confirm(`Are you sure you want to clear all bookings for ${date}?`)) return;

  const bookingsRef = collection(db, "bookings");
  const q = query(bookingsRef, where("date", "==", date));

  getDocs(q)
    .then(snapshot => {
      const batch = writeBatch(db);
      snapshot.forEach(doc => {
        batch.delete(doc.ref); // Delete each document in the snapshot
      });

      return batch.commit(); // Commit the batch operation
    })
    .then(() => {
      alert(`✅ All bookings for ${date} have been cleared`);
    })
    .catch(err => {
      console.error("Error clearing bookings:", err);
      alert("❌ Failed to clear bookings");
    });
}
